# Release: on a v* tag, create a GitHub Release with generated notes.
# npm publishing is OPTIONAL: it runs only when an NPM_TOKEN secret exists
# (registry token with publish rights). Until then the job is skipped and the
# GitHub Release alone marks the version.
#
# NOTE: `secrets` is NOT available in step-level `if:` expressions — the
# presence check goes through a job-level env var instead.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + test + build)
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm (only when NPM_TOKEN is configured)
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish

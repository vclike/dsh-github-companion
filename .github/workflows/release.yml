# Release: on a v* tag, create a GitHub Release with generated notes.
# npm publishing is OPTIONAL: it runs only when an NPM_TOKEN secret exists
# (registry token with publish rights). Until then the job is skipped and the
# GitHub Release alone marks the version.
#
# NOTE: `secrets` is NOT available in step-level `if:` expressions — the
# presence check goes through a job-level env var instead.
name: Release

on:
  push:
    tags: ['v*']
  # Manual dispatch lets the release pipeline be tested without burning tags
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    # Hard cap: hung steps must never bill past 15 minutes (2026-08-28)
    timeout-minutes: 15
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci --prefer-offline --fetch-timeout=60000 --fetch-retries=2 --fetch-retry-maxtimeout=20000 --loglevel=info

      # Same rationale as ci.yml: fast-fail attempt 1, then a fresh process on
      # a different network path (npmmirror).
      - name: Retry install via mirror (transient registry stall)
        if: failure()
        timeout-minutes: 4
        run: npm ci --prefer-offline --registry=https://registry.npmmirror.com --fetch-timeout=60000 --fetch-retries=2 --loglevel=info

      - name: Verify (typecheck + test + build)
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm (only when NPM_TOKEN is configured)
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish

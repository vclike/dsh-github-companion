name: release

# Trigger: any v* tag push. Publishes to npm via Trusted Publishing (OIDC,
# no token needed once the GitHub repo is added to npm's trusted
# publishers list) and writes a GitHub Release with auto-generated notes.
#
# A manual workflow_dispatch is also available; it defaults to dry-run so a
# tag-pushed dry-run can verify the pipeline before turning real-publish on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, skips npm publish (runs only typecheck + build + smoke)'
        required: false
        default: 'true'

permissions:
  contents: write
  id-token: write   # Trusted Publishing OIDC token

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # NPM_TOKEN fallback for hosts that haven't migrated to Trusted
      # Publishing yet. When the secret is empty, the publish step skips.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --fund=false

      - name: Verify (typecheck + test + build)
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Smoke-load (registries, settings, gate, skill)
        # The verify-load script is what the README documents as the
        # "boot the plugin in a headless profile and assert every bundle
        # mounted + every registered tool responds" gate. A short failure
        # here is much cheaper than a 400 on the npm registry.
        run: node scripts/verify-load.mjs

      - name: Publish to npm (Trusted Publishing via OIDC)
        if: env.HAS_NPM_TOKEN != 'true' && (github.event_name == 'push' || inputs.dry_run != 'true')
        # Trusted Publishing: no NPM_TOKEN required. The OIDC token issued
        # by GitHub Actions is verified by npm against the trusted
        # publishers list (set up once at
        # https://www.npmjs.com/settings/trusted-publishers — add
        # vclike/dsh-github-companion with workflow filename `release.yml`).
        run: npm publish --provenance --access public --tag next

      - name: Publish to npm (NPM_TOKEN fallback for pre-TP hosts)
        if: env.HAS_NPM_TOKEN == 'true' && (github.event_name == 'push' || inputs.dry_run != 'true')
        # HMAC-stamped token lives in repo secrets. The provenance flag is
        # rejected by Trusted Publishing workflows without an id-token, but
        # it works fine here.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --tag next

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish summary
        if: success()
        run: |
          version=$(node -p "require('./package.json').version")
          echo "## v$version released" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/dsh-github-companion" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub release: https://github.com/vclike/dsh-github-companion/releases/tag/v$version" >> "$GITHUB_STEP_SUMMARY"

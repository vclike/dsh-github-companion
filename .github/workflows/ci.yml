# CI: typecheck + tests (with coverage) + build on every push/PR to main.
# Pure-JS plugin — one OS is enough; matrix covers the supported Node range.
name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes skip CI entirely (2026-08-28 minute discipline)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_dev/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Hard cap: a hung npm ci must never bill past 10 minutes (2026-08-28)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci --prefer-offline --fetch-timeout=60000 --fetch-retries=2 --fetch-retry-maxtimeout=20000 --loglevel=info

      # npm ci on hosted runners intermittently wedges (~2026-08-28, silent
      # stalls mid-download). Attempt 1 fast-fails per request; the retry takes
      # a different network path entirely (npmmirror) with a fresh process.
      - name: Retry install via mirror (transient registry stall)
        if: failure()
        timeout-minutes: 4
        run: npm ci --prefer-offline --registry=https://registry.npmmirror.com --fetch-timeout=60000 --fetch-retries=2 --loglevel=info

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

# CI: typecheck + tests (with coverage) + build on every push/PR to main.
# Pure-JS plugin — one OS is enough; matrix covers the supported Node range.
name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes skip CI entirely (2026-08-28 minute discipline)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_dev/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Hard cap: a hung npm ci must never bill past 10 minutes (2026-08-28)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Root cause of the 2026-08-28 "npm ci hangs" incident: strict peer
      # revalidation loops forever on the @deepseek-ai/* cordis peer graph.
      # Fixed at the source via repo .npmrc (legacy-peer-deps=true); keep the
      # step caps + one retry as generic resilience.
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Retry install
        if: failure()
        timeout-minutes: 5
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

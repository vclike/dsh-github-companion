# CI: typecheck + tests (with coverage) + build on every push/PR to main.
# Pure-JS plugin — one OS is enough; matrix covers the supported Node range.
name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes skip CI entirely (2026-08-28 minute discipline)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_dev/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Hard cap: a hung npm ci must never bill past 10 minutes (2026-08-28)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

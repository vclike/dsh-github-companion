# CI: typecheck + tests (with coverage) + build on every push/PR to main.
# Pure-JS plugin — one OS is enough; matrix covers the supported Node range.
name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes skip CI entirely (2026-08-28 minute discipline)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_dev/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Hard cap: a hung npm ci must never bill past 10 minutes (2026-08-28)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # NOTE: no `cache: npm` — the restored cache entry correlates with the
      # silent npm ci stalls of 2026-08-28 (attempt-5 log: 475 metadata GETs
      # at ~35ms via mirror, then a stall right before the tarball phase).

      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci --registry=https://registry.npmmirror.com --fetch-timeout=60000 --fetch-retries=2 --loglevel=info

      # Fallback: fresh process on the official registry path.
      - name: Retry install via official registry
        if: failure()
        timeout-minutes: 4
        run: npm ci --fetch-timeout=60000 --fetch-retries=2 --loglevel=info

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
